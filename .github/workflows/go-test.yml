name: go-test
on:
  pull_request:
  schedule:
    - cron: '49 4 20 * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
        cgo: ['0', '1']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test -count=1 ./...
