name: golangci-lint

# Never add pull_request_target or workflow_run to any workflow here. They
# run with this repository's secrets and a token that can write, so a
# workflow that checks out or runs a pull request's code under them hands
# both to whoever wrote that code, including a fork's author.

on:
  pull_request:
  # A pull request can restore only its own caches and main's, so main
  # must run to save caches the next pull request can use.
  push:
    branches: [main]
  schedule:
    - cron: '49 4 20 * *'

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Its own cache, as in go-test.yml, since the tests' builds share no
      # key with this one.
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-lint-${{ hashFiles('go.mod') }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
