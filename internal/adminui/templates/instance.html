{{define "title"}}{{.Heading}}{{end}}
{{define "heading"}}<a class="back" href="{{.InstanceEdit.Back}}"><span aria-hidden="true">←</span> Recipes</a>
<div class="page-head">
<h1>{{.Heading}}</h1>
</div>{{end}}
{{define "content"}}{{with .InstanceEdit}}{{if $.Error}}<p class="error" role="alert">{{$.Error}}</p>{{end}}
<section class="panel form-panel" aria-labelledby="edit-title">
<h2 id="edit-title">Edit instance</h2>
<form method="post" action="{{.Action}}">
<input type="hidden" name="seen" value="{{.Seen}}">
{{template "instance-fields" .}}
<button class="btn btn-primary" type="submit">{{.Submit}}</button>
</form>
</section>{{end}}{{end}}
